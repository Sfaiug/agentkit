# adapters/antigravity.toml -- everything agentkit reads off an Antigravity seat's screen, and
# who has the authority to say what that seat is doing.  Paired with adapters/antigravity.sh;
# the format is the adapter contract in docs/guide.md, "Adding a harness".
# Verified against agy 1.2.9; see tests/fixtures/README.md for the captures.
version = 1

# How `ak update` moves this harness: `agy update` takes the latest release and no version,
# so nothing puts an older build back.
[update]
version = ["agy", "--version"]
upgrade = ["agy", "update"]
cannot = "agy update installs the latest release only"

# An Antigravity seat owns only the conversation its own TUI opened: `--conversation` resumes
# one that exists and nothing names one that does not, so `interactive` refuses a
# launcher-issued id and the seat starts a new conversation.  Past ones stay in agy's own
# store, resumable by hand with `/resume`.
[conversation]
fresh_words = "no conversation recorded; it starts a new conversation"

# No hooks are installed (see `hooks` in adapters/antigravity.sh), so the screen decides all
# three states.
[authority]
working = "screen"
asking = "screen"
at_prompt = "screen"

# The end-of-turn rule -- a turn ends with a question, a done, or a run to wait on -- is
# typed at the seat by the `ak watch` tick, for want of an end-of-turn hook to enforce it.
[stop]
enforce = "nudge"

[screen]
# The composer is a bare `>` between two rules; a typed line reads `> text`, and so does every
# prompt the transcript echoes, which is why only the empty one is chrome.
composer = '^>$'
# and the line under it: a key hint on the left -- `? for shortcuts` at rest, `esc to cancel`
# while a turn runs or a chooser is open, nothing over a draft -- and on the right the model
# and effort (`Gemini 3.8 Flash · low`), or, on a seat opened with `--agent`, the agent with
# them once agy has resolved the model (`agentkit (Gemini 3.8 Flash · low)  /agents`).
footer = ['(?:\? for shortcuts|esc to cancel)?\s*(?:[^·]+ · (?:low|medium|high)|[\w.-]+(?: \([^)]*\))?\s+/agents)']

# Read in file order, first match wins: the dialogs before the spinner, the spinner before the
# prompt, because the composer is still drawn while a turn runs.
# The workspace trust dialog, in a folder agy has not been told to trust: its question and
# both controls.
[[rule]]
id = "asking.trust"
state = "asking"
lines = 8
all = ["do you trust the contents of this project?", "yes, i trust this folder", "no, exit"]

# Signed out, agy opens on its sign-in chooser instead of a composer.
[[rule]]
id = "asking.signin"
state = "asking"
lines = 6
all = ["you are currently not signed in", "select login method", "enter select"]

# The slash-command chooser a typed `/` opens: its `enter Select · tab Complete` hint over the
# footer.  It is the owner's own line, never a turn, so it reads as a draft (captured).
[[rule]]
id = "draft.chooser"
state = "draft"
lines = 8
all = ["enter select", "tab complete"]

# A turn in flight: the footer says `esc to cancel` under a spinner whose word changes
# (`Generating...`, `Loading...`).
[[rule]]
id = "working.cancel"
state = "working"
lines = 8
any = ["esc to cancel"]

# A line typed and not sent: the footer drops its left-hand key hint while the composer holds
# text, leaving only the model or the agent (captured).  The generic draft machinery reads a
# `❯›⟩` mark and this composer's is `>`, so the footer is what tells the draft apart, and
# nothing is typed into or sent from a seat reading draft.
[[rule]]
id = "draft.typed"
state = "draft"
lines = 8
none = ["esc to cancel"]
newest = '^(?:[^·?]+ · (?:low|medium|high)|[\w.-]+(?: \([^)]*\))?\s+/agents)$'

[[rule]]
id = "prompt.composer"
state = "at_prompt"
lines = 8
at_composer = true

# A failed turn is a `⚠ <message>` line over `Error ID: <id>` (captured), and the stream-json
# result of one carries `"status":"ERROR"` beside the same message.  The quota and transient
# sentences are the executable's own strings; RESOURCE_EXHAUSTED and UNAVAILABLE are the
# canonical statuses it names for a 429 and a 503, and a status number is only ever matched in
# its own `(code N)` framing (`%s (code %d): %s`), never bare, where an error id, a count or a
# token total could carry the same digits.  agy retries 429s, 503s and overloads itself before
# it gives up, so what reaches here is what it could not ride out; the worker answers the
# transient ones by typing `continue`, resuming the same conversation -- only `quotas` names
# the account and hands the round over.
[stall]
signatures = ["Error ID: "]
refusals = ["RESOURCE_EXHAUSTED", "exhausted your quota", "Quota exhausted", "(code 429)",
  "UNAVAILABLE", "experiencing high traffic", "currently overloaded",
  "(code 500)", "(code 502)", "(code 503)", "(code 504)", "Internal server error",
  "overloaded", "at capacity"]
quotas = ["RESOURCE_EXHAUSTED", "exhausted your quota", "Quota exhausted", "(code 429)"]

# Signed out, a headless turn prints the first of these on stderr and waits a minute for a
# code nobody pastes, then fails with the second; both were observed.  The TUI's own
# signed-out screen is the asking.signin rule above.
[auth]
title = "Gemini"
remedy = "exit agy, run `agy` in the host shell and sign in (open the URL, paste the code), then reopen the session"
signatures = [
  "Authentication required. Please visit the URL to log in:",
  "authentication failed or timed out",
]

# agy 1.2.9 has no compact command among its 46 slash commands; it compacts a conversation's
# context itself.  tools/idle-compact.py would only ever say so, so a seat is not wrapped in it.
[compact]
command = "none"

# The effort words this harness takes, in the order the menu's `c` screen cycles them.
[effort]
levels = ["low", "medium", "high"]

# The models this harness runs when `agy models` cannot say: what agy 1.2.9 listed, each
# effort-suffixed id folded into its model the way `models` in adapters/antigravity.sh folds
# them, strongest last.  An id with no effort word is a model agy runs at no effort, `none`.
[catalog]
"gemini-3.8-flash" = { label = "Gemini 3.8 Flash", efforts = ["low", "medium", "high"] }
"gemini-3.7-flash" = { label = "Gemini 3.7 Flash", efforts = ["low", "medium", "high"] }
"gemini-3.6-flash" = { label = "Gemini 3.6 Flash", efforts = ["low", "medium", "high"] }
"gemini-3.1-pro" = { label = "Gemini 3.1 Pro", efforts = ["low", "high"] }
claude-sonnet-4-6 = { label = "Claude Sonnet 4.6 (Thinking)", efforts = ["none"] }
claude-opus-4-6-thinking = { label = "Claude Opus 4.6 (Thinking)", efforts = ["none"] }
gpt-oss-120b = { label = "GPT-OSS 120B", efforts = ["medium"] }
