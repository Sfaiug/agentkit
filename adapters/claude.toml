# adapters/claude.toml -- everything agentkit reads off a Claude Code seat's screen, and who
# has the authority to say what that seat is doing.  Paired with adapters/claude.sh; the format
# is the adapter contract in `config.adapter`.
# Verified against Claude Code 2.1.263; see tests/fixtures/README.md for the captures.
version = 1
name = "Claude Code"
colour = "#D97757"

[check]
model = "claude-haiku-4-5"
effort = "none"

[launch]
# `interactive` hands $AGENTKIT_FIRST_PROMPT to the TUI as its first prompt, fresh or resumed
first_prompt = true

[worker]
state = ["~/.claude", "$CLAUDE_CONFIG_DIR", "~/.claude-$AGENTKIT_ACCOUNT"]
logins = ["~/.claude/.credentials.json", "$CLAUDE_CONFIG_DIR/.credentials.json", "~/.claude-$AGENTKIT_ACCOUNT/.credentials.json"]
# the `type`s of events.jsonl records that only say a tool still runs: about every 30 s while
# one Bash call blocks, so a hung call would never go silent if they counted
heartbeats = ["tool_progress"]

# How `ak update` moves this harness, and what `ak usage` needs beyond `<adapter> usage`:
# `claude install <version>` is a versioned reinstall, so a failed upgrade goes back by command
# and needs no snapshot, and the usage call is one plain adapter call with no reset to spend.
# `latest` is the release the tick upgrades it to in the background: npm's, the same builds.
[update]
version = ["claude", "--version"]
upgrade = ["claude", "install", "latest"]
revert = ["claude", "install", "{version}"]
latest = ["npm", "view", "@anthropic-ai/claude-code", "version"]

# The usage endpoint answers every token with 429 and a Retry-After when asked too often,
# so this harness is asked at most once every fifteen minutes, whoever asks, and never
# before the Retry-After of its last refusal.
[usage]
probe_every = 900

[sleep]
own = []    # on an idle seat nothing of Claude's runs under it: what does is work (`agentkit.sleep`)

# "hooks" means adapters/claude.sh hooks installs something that reports this state; "screen"
# means only the rules below can say it.  A hook fact still gives way to a rule that positively
# names a different state: Claude reports a dialog going up, and a question or plan answered,
# but nothing when a tool's permission is granted or a dialog is put away with Esc.
[authority]
working = "hooks"
asking = "hooks"
at_prompt = "hooks"

# The events adapters/claude.sh hooks installs, and what each one means.  `kinds` matches the
# hook's payload discriminator -- for Notification that is `notification_type`, which 2.1.263
# builds alongside `message` and `title`.  An event listed with no `kinds` matches any.
[[hooks.event]]
name = "UserPromptSubmit"
state = "working"
# what its hook prints as `hookSpecificOutput.additionalContext` reaches the model with the
# prompt (Claude Code): a changed rulebook is named there (`orch.rulebook_news`)
context = true

# hooks/orchestrator-stop.sh writes each Stop down once it has judged it.  A Stop is a turn that
# ended, except two: one with background work the seat started still in flight (`background_tasks`
# in the payload; that work's task notification begins the next turn), and one the hook sent back
# to work (`held`).  First match wins.  `background` marks the wait whose composer stays open,
# so unsent text there is the owner's.
[[hooks.event]]
name = "Stop"
state = "working"
kinds = ["background"]
background = true

[[hooks.event]]
name = "Stop"
state = "working"
kinds = ["held"]

[[hooks.event]]
name = "Stop"
state = "at_prompt"

# A turn that fails on an API error, a spent usage limit among them, ends with StopFailure in
# place of Stop (2.1.305): the turn is over, and `failed` has its look settle the seat's
# account first (`watch.hook_look`).
[[hooks.event]]
name = "StopFailure"
state = "at_prompt"
failed = true

# A question, a plan or a tool's permission prompt fires PermissionRequest as it is drawn
# (2.1.292); its notice six seconds later adds nothing to the question written down.
[[hooks.event]]
name = "PermissionRequest"
state = "asking"

[[hooks.event]]
name = "Notification"
state = "asking"
kinds = ["permission_prompt", "worker_permission_prompt", "agent_needs_input"]

[[hooks.event]]
name = "Notification"
state = "at_prompt"
kinds = ["idle_prompt"]

# Installed for AskUserQuestion and ExitPlanMode alone: it fires as the owner answers, and the
# turn that asked runs on.
[[hooks.event]]
name = "PostToolUse"
state = "working"

# `/compact` runs between turns; its kind is the payload's `trigger`.  Compaction Claude starts
# itself (`auto`) says nothing: inside a turn its Stop ends it, and at a quiet prompt (2.1.292,
# "Compacted while idle") no Stop follows, so a `working` it wrote would stand for good.
[[hooks.event]]
name = "PreCompact"
state = "working"
kinds = ["manual"]

[[hooks.event]]
name = "PostCompact"
state = "at_prompt"
kinds = ["manual"]

[screen]
# fullmatch against a bottom line: the input box, which is chrome and not anything Claude said;
# a renamed session's name sits in the box's top rule
composer = '(?:(?:│\s*)?[>❯](?:\s+Try ["“].*["”])?\s*(?:│)?|⏵⏵ bypass permissions on(?: \(shift\+tab to cycle\))?(?: · \d+ \w+)? · ← for agents|● \w+ · /effort|[✻✽✶✳✢] \w+ for .+ · done .+|─{3,} \S.* ─+)$'
# Ctrl-G hands the composer to $VISUAL, ak's editor, mid-turn too (Claude Code 2.1.302)
editor = ["C-g"]
# and the key hints under it, on top of the box-drawing and prompt footer every harness shares
footer = [
  '\? for shortcuts',
  '(?:⏵⏵\s*)?bypass permissions on(?:\s*\(shift\+tab to cycle\))?(?:\s*·\s*\d+\s+\w+)?(?:\s+[◯○]?\s*\d+% context left)?',
  '\d+% context left(?:\s*·\s*\? for shortcuts)?',
  # a narrow pane cuts the mode line wherever its width ends, with or without an ellipsis
  '⏵⏵\s*bypass\b.*',
  # the other modes shift+tab cycles through (2.1.292)
  '(?:⏵⏵|⏸)\s*(?:accept edits|plan mode|manual mode)\b.*',
  # the hint drawn under its own usage-limit notice (2.1.286), which is what was said
  '/usage-credits to finish what you.re working on\.',
]
# its composer always has its own rule under it: a prompt-marked line right on the footer is a
# user's status line, never the composer, even with no composer drawn, as under a picker
ruled = true
# A typed line longer than this many characters is folded into `[Pasted text #N]` (2.1.289,
# at any width: 800 showed whole, 900 folded), which no screen read can tell from the owner's
# own paste.  A line ak types to be read back stays within it.
folds_over = 800
# That fold as its composer shows it, read without whitespace (2.1.291).  After a line ak typed
# past `folds_over`, a composer holding one fold and nothing beside it is taken for that line.
folded = '\[Pasted\s*text\s*#\d+\]'
# 2.1.292 lists the agents running in the background under its footer, at the screen's foot:
# `● main` and a row per agent, `◯ general-purpose  <what it does>  <time> · ↓ <tokens>`,
# the one on view filled.
tray = '[●◯] \S.*'
# Scrolled up from its live bottom -- a wheel notch, PgUp -- it draws this pill on the row right
# above its bottom rule, and the rows over it are the transcript, a dialog's controls cut off:
# such a screen reads nothing (2.1.292).
away = 'Jump to bottom \(ctrl\+End\) ↓'

# Read in file order, first match wins: the dialog before the spinner, the spinner before the
# prompt, because the composer is still drawn while a turn runs.
# The workspace-trust dialog: three of its own controls, in the last few lines, with its final
# control line newest.  Transcript text quoting one of them is above a composer, not below it.
[[rule]]
id = "asking.trust"
state = "asking"
lines = 6
all = ["❯ ", "enter to confirm", "esc to cancel"]
newest = '(?i)enter to confirm'

# AskUserQuestion's controls are the newest rows on its screen. One
# question navigates with ↑/↓, two or more with Tab/Arrow keys; hints follow before the
# cancel: a focused "Type something" or an open note adds `ctrl+g to edit in <editor>`,
# options with previews add `n to add notes` (2.1.289).  So the line's start decides: a
# hint the next release adds must not hide the question.
[[rule]]
id = "asking.question"
state = "asking"
lines = 1
newest = '^Enter to select · (?:↑/↓|Tab/Arrow keys) to navigate\b'

# A tool's permission prompt (2.1.292, manual mode): `Do you want to proceed?` or `Do you want
# to create hello.txt?`, its options, and this hint as its newest line.
[[rule]]
id = "asking.permission"
state = "asking"
lines = 1
newest = '^Esc to cancel · Tab to amend\b'

# ExitPlanMode's approval: its question and its last option, over its editor hint.
[[rule]]
id = "asking.plan"
state = "asking"
lines = 8
all = ["would you like to proceed?", "tell claude what to change"]
newest = '^ctrl\+g to edit in\b'

# 2.1.292's spinner, `✻ Moonwalking… (10s · ↓ 207 tokens)`, from the left edge, its parenthesis
# wrapped in a narrow pane and a tip under it; its done line and `✻ Waiting for 1 background
# agent to finish` have no "…".  Drawn on, with the footer's hint, while Stop hooks run a turn
# that is over: the Stop decides.
[[rule]]
id = "working.spinner"
state = "working"
lines = 10
row = '^[·✢✳✶✻✽*] [^…()]+…(?: \(.*)?$'
none = ["(running stop"]

# Streaming draws no spinner, only the footer's `· esc to interrupt`, which a pane narrower than
# about 67 columns cuts (`esc to …` at 60) and a composer holding text drops.
[[rule]]
id = "working.interrupt"
state = "working"
lines = 10
newest = 'esc to (?:interrupt|\S*…)'
none = ["(running stop"]

# A composer holding bright, typed text is a draft never sent. A composer whose
# only content is dim -- Claude's suggested next prompt, the Try placeholder -- is
# empty. Both are read with `-e` attributes; see watch.has_dim. Draft before prompt.
[[rule]]
id = "prompt.draft"
state = "draft"
lines = 8
at_composer = true
none = ["esc to interrupt"]

[[rule]]
id = "prompt.suggestion"
state = "at_prompt"
lines = 8
at_composer = true
none = ["esc to interrupt"]

[[rule]]
id = "prompt.composer"
state = "at_prompt"
lines = 8
at_composer = true
none = ["esc to interrupt"]

# `quotas` names the account: a spent window rather than a fault.  `Usage limit
# reached` is 2.1.263's own wording for one: its executable builds the notice as "Usage limit
# reached" alone, or followed by " \xB7 continuing automatically at <time>", " \xB7 continuing
# automatically when it resets", " \xB7 finishing up" or " \xB7 a little extra on us, then your
# credits".  `rate_limit_error` is what the same limit reads as in a headless stream: `S(e)`
# there tests `status === 429 || message.includes('"type":"rate_limit_error"')`.  `refusals`
# carries the transient words beside them -- a 500 the worker answers by typing `continue`,
# resuming the same session, never by handing the round over.
[stall]
# "hit your session limit" is how 2.1.292 refuses a spent window; never "session limit" alone,
# which its warnings ("You've used 84% of your session limit") say with room left.
signatures = ["API Error", "Overloaded", "rate limit", "rate_limit_error",
              "Usage limit reached", "hit your session limit", "weekly limit",
              "Can't reach the API server"]
refusals = ["usage limit", "rate limit", "rate_limit_error", "overloaded", "529",
            "500", "502", "503", "504", "Internal server error", "API Error",
            "Can't reach the API server", "at capacity"]
quotas = ["rate limit", "rate_limit_error", "Usage limit reached", "usage limit",
          "hit your session limit", "weekly limit", "429", "insufficient_quota", "insufficient quota"]
# `terminal` is the event log's terminal record kind: the stream ends with a `result` event,
# which is what adapters/claude.sh reads final.md out of, failure or not.
terminal = "result"
# `coloured`: behind the same `● `, it draws its own notice's words in a colour and the model's
# answer in the terminal's own (captured with attributes, 2.1.286, in every theme), so on a
# seat's screen a stall word counts only on a line drawn wholly in colour: the answer styles
# spans of its own in colour too.
coloured = true

[auth]
title = "Claude Code"
remedy = "run /login"
# Claude's own auth wrapper precedes arbitrary 401/403 server text, so the wrapper itself is
# the signature: matching a particular server message misses real expiry, revocation and new
# wording.  The listed messages are the exact ones seen in the installed executable.
wrapper = '\bPlease run /login\b'
signatures = [
  "Login expired · Please run /login",
  "Please run /login",
  "Invalid API key",
  "Invalid API key · Please run /login",
  "OAuth token has expired",
  "Please run /login · API Error: 401 Invalid API key",
  "OAuth token revoked · Please run /login",
  "Not logged in · Please run /login",
  "Invalid API key · Fix external API key",
]

# The effort words this harness takes, in the order the menu's `c` screen cycles them:
# `claude --help`'s, which refuses `ultra`.
[effort]
levels = ["low", "medium", "high", "xhigh", "max"]

# The models this harness runs when Anthropic's models API cannot say (`adapters/claude.sh
# models` asks it): the model table claude 2.1.280 ships, each model with the efforts its
# capabilities (`effort`, `xhigh_effort`, `max_effort`) let it take, strongest last.  Haiku 4.5
# has none of them: it runs at no effort, `none`, which claude warns of and ignores.  Sonnet 5.5
# is newer than 2.1.280's table: Anthropic's models API lists it with all five efforts (29 Sep),
# and 2.1.280 runs it, warning `unrecognized_model`.
[catalog]
claude-fable-5-1 = { label = "Fable 5.1", efforts = ["low", "medium", "high", "xhigh", "max"] }
claude-opus-5-5 = { label = "Opus 5.5", efforts = ["low", "medium", "high", "xhigh", "max"] }
claude-sonnet-5-5 = { label = "Sonnet 5.5", efforts = ["low", "medium", "high", "xhigh", "max"] }
claude-sonnet-5 = { label = "Sonnet 5", efforts = ["low", "medium", "high", "xhigh", "max"] }
claude-sonnet-4-6 = { label = "Sonnet 4.6", efforts = ["low", "medium", "high", "max"] }
claude-haiku-4-5 = { label = "Haiku 4.5", efforts = ["none"] }

# A worker credential of its own, apart from the seat's interactive login: `claude
# setup-token` mints it, install.sh writes it here, `auth` dates it a year from this file,
# and the tick warns on every seat from a fortnight out.  A harness with no such table
# has no worker token, and nothing is asked about one.
[worker_token]
file = "claude_oauth_token"
remedy = "run claude setup-token and replace ~/.agentkit/secrets/claude_oauth_token"
