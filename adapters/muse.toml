# adapters/muse.toml -- everything agentkit reads off a Muse Code seat's screen.  Paired with
# adapters/muse.sh; the format is the adapter contract in `config.adapter`.
# Verified against Muse Code 1.2.1 (and the 1.0.3/1.1.1 captures); see tests/fixtures/README.md.
# A worker turn or seat still loads the trusted workspace's personal rules (Muse 1.4.1 drops them only with the trust its delegation needs), and a seat Claude's and Codex's personal skills too: Muse 1.4.3's TUI takes no --no-foreign-personal-context, only `muse exec` does.
version = 1
name = "Muse Code"
colour = "#3E9EFB"

[check]
model = "muse-spark-1.3-contributor"
effort = "minimal"

# Muse has no switch for its own personal rules, and its TUI none for Claude's and Codex's
[instructions]
# Muse's own rules live under $XDG_CONFIG_HOME/muse: ~/.muse-<name>/muse on an account
# (muse.sh sets it on the seat's line; a worker turn's box knows the account's name);
# Claude's and Codex's personal rules are read from their usual homes whatever the account
unswitched = ["${XDG_CONFIG_HOME:-~/.config}/muse/AGENTS.md", "~/.muse-$AGENTKIT_ACCOUNT/muse/AGENTS.md",
              "~/.claude/CLAUDE.md", "~/.codex/AGENTS.md"]

[worker]
state = ["~/.config/muse", "$XDG_CONFIG_HOME/muse", "~/.muse-$AGENTKIT_ACCOUNT",
         "~/.local/share/muse", "$XDG_DATA_HOME/muse"]
logins = ["~/.config/muse/auth.json", "$XDG_CONFIG_HOME/muse/auth.json", "~/.muse-$AGENTKIT_ACCOUNT/muse/auth.json"]

# How `ak update` moves this harness.  `upgrade` is the launcher's own install path, the one
# `install.sh` used; with MUSE_NO_AUTO_UPDATE=1 pinning it everywhere else, this is the only way
# muse ever moves.  It offers no versioned reinstall, so there is no `revert` and `cannot` says
# why; the snapshot agentkit/harness/muse.py takes of the launcher's directory, with its build,
# its metadata and its launch links, is the rollback instead: saved before anything moves and
# put back when an upgrade or a gate fails.  `latest` is the build the launcher's channel names,
# asked the way the launcher asks it.
[update]
version = ["muse", "--version"]
upgrade = ["muse"]
env = { MUSE_LAUNCHER_INSTALL = "1" }
cannot = "its channel installer offers no versioned reinstall"
latest = ["sh", "-c", '''
exec curl -fsSL -A muse-code/launcher-3 "https://api.meta.ai/muse-code/channels/${MUSE_CHANNEL:-muse-stable}"''']

# What a seat launch tells this harness and no child of that seat may be told.  Muse takes its
# rulebook from the environment (see `interactive` in adapters/muse.sh), and everything a seat
# starts inherits its environment: a worker, a done-when command or another harness launched
# from that seat would be handed the orchestrator's rules and refuse its own work.  Named here,
# the core drops it from every child environment it builds -- config.seat_env_names().
# The launch's receipt (agentkit/harness/muse.py) is the seat's alone the same way.
# `programs` is what a running Muse is called besides `muse`: its launcher execs the build it
# installed, so a tmux session running `muse-bin-<build>` holds an agent -- orch.agent_programs().
[launch]
seat_env = ["TBH_EVAL_APPEND_SYSTEM_PROMPT_FILE", "AGENTKIT_MUSE_RECEIPT"]
programs = ["muse-bin-*"]

# Its usage call runs a model, so it goes through the shared supervisor (`capture`) and comes
# back without the moment it was measured (`strips_timestamp`); agentkit/harness/muse.py
# matches the response against what was cached to date it.
[usage]
capture = true
strips_timestamp = true

# Muse 1.4.7's hooks reach a seat from its launch (`adapters/muse.sh interactive`).  Its own
# question tool fires no tool hook, but its dialog opening is a Notification of its own kind,
# which no text on the screen can fake: that decides `asking`, as an approval's notice does on a
# seat launched without yolo.  The turn's states stay the screen's, as on a muse with no hooks.
[authority]
working = "screen"
asking = "hooks"
at_prompt = "screen"

# its turn's end puts that question down, whatever the screen draws after it
[[hooks.event]]
name = "Stop"
state = "at_prompt"

[[hooks.event]]
name = "Notification"
state = "asking"
kinds = ["question_prompt", "permission_prompt"]

# its question answered: the batch that ran its tool, and never the batches its reminders run
# beside the turn -- `adapters/muse.sh hook` names a batch by its first tool
[[hooks.event]]
name = "PostToolBatch"
state = "working"
kinds = ["request_user_input"]

# an Esc fires this and no Stop: the turn is over, and a question it had up is down with it;
# the owner stopped it, so the seat rests whatever its plan still owes
[[hooks.event]]
name = "Interrupt"
state = "at_prompt"
interrupt = true

# The end-of-turn rule -- a turn ends with a question, a done, or a run to wait on -- needs a
# blocking end-of-turn hook to enforce itself, and Muse has none.  `nudge` asks the `ak watch`
# tick to apply the same test to the screen instead and to type the continue keystroke once per
# episode; Claude Code and Codex both take hooks/orchestrator-stop.sh and say nothing here.
[stop]
enforce = "nudge"

[screen]
# 1.2.1 draws `❯` where 1.0.3 drew `⟩`; the shared footer already reads both.  The status line
# ends on its approvals, `YOLO` or, launched without it, `Auto-review` or `Launch overrides`,
# and keeps `compacted context` beside them for a few seconds after a compaction.
composer = '(?:⟩|[\w.-]+ · (?:none|minimal|low|medium|high|xhigh|max|ultra) · .+ · (?:YOLO|Auto-review|Launch overrides)(?: {2,}compacted context)?)$'
# 1.4.7 draws its composer between two rules, so a draft wrapped onto a second row is still its
ruled = true
# 1.4.7 draws its rotating composer suggestions ("Ask to monitor a running build …") in this
# grey, with no faint attribute, and typed text in 252: the grey reads as faint, so empty.
faint = ["38;5;242"]
# 1.4.7 draws a tray of background tasks between its composer and its status line: a header,
# up to four tasks, then `+N`.
tray = '(?:main(?: · ↓ to select)?|[├└] .+)'
# Ctrl-G hands the composer to $VISUAL, ak's editor
editor = ["C-g"]
# but a paste as its placeholder, which Muse sends alone once the editor returns: a composer that
# may hold one, shown or above the rows read, opens no editor (`watch._may_paste`)
pasted = '\[Pasted\s+Content\s+\d+\s+chars\]'

# Muse's picker: both choices and the key hint, in the last few lines with the hint newest.
[[rule]]
id = "asking.picker"
state = "asking"
lines = 6
all = ["enter to choose", "↓↑ to select", "esc to quit"]
newest = '(?i)to select'

[[rule]]
id = "working.interrupt"
state = "working"
lines = 8
# the spinner, `◇ Thinking (0s · esc to interrupt)`, drawn from the left edge: its question's
# options are indented, and its key hint ends `Esc to interrupt` with no bracket
row = '^[^\s❯›⟩>].*esc to interrupt\)'

# an approval dialog, a seat launched without yolo draws where its composer was: its last line,
# at the left edge, where no row a turn prints starts
[[rule]]
id = "asking.approval"
state = "asking"
lines = 3
row = '^Change approval defaults in /permissions$'

# what the status line says beside its approvals while a turn is being interrupted, compacted
# or handed a queued line, where no spinner may be drawn in the rows the rule above reads
[[rule]]
id = "working.footer"
state = "working"
lines = 1
row = ' · .* {2,}(?:interrupting run|compacting context|steering the running turn)$'

# the owner's own `/model` and `/resume` pickers, their key hints where the status line was:
# their unfinished input, which a line typed there would pick from, and Enter under one picks a
# row (`picker`)
[[rule]]
id = "prompt.picker"
state = "draft"
lines = 2
any = ["esc go back", "esc exit"]
picker = true

# A composer holding bright, typed text is a draft never sent. Muse has no
# suggestion feature: its suggestion fixture is its placeholder, the empty box.
# Both are read with `-e` attributes; see watch.has_dim. Draft before prompt.
# None is read under a question's dialog: its key hint, or its review step's last two choices
# as drawn right over the composer, indented past a reply's rows, the cursor on either or on an
# answer above them (a line typed there lands on the row it holds).
[[rule]]
id = "prompt.draft"
state = "draft"
lines = 8
at_composer = true
none = ["esc to interrupt", "submit answers\n    interrupt turn\n─",
        "    submit answers\n  ⟩ interrupt turn\n─"]

[[rule]]
id = "prompt.suggestion"
state = "at_prompt"
lines = 8
at_composer = true
none = ["esc to interrupt", "submit answers\n    interrupt turn\n─",
        "    submit answers\n  ⟩ interrupt turn\n─"]

[[rule]]
id = "prompt.composer"
state = "at_prompt"
lines = 8
at_composer = true
none = ["esc to interrupt", "submit answers\n    interrupt turn\n─",
        "    submit answers\n  ⟩ interrupt turn\n─"]

# `429`/`quota exhausted` are the 1.0.3 capture's own words; `usage limit reached` is how the
# installed 1.3.0 executable spells the same model failure, first in the list of reasons a
# request did not run (`authentication failed`, `configuration error`, `response protocol
# error`, `server error`, `rate limited` follow it).  Its neighbour `rate limited` is not
# listed in quotas: the same executable uses those two words for a throttled feedback upload
# too, which is nothing to do with the model's window.  `refusals` carries the transient words
# beside the account ones -- `model stream idle timeout` the worker answers by typing
# `continue`, resuming the same session, never by handing the round over.
[stall]
signatures = ["429", "quota exhausted", "usage limit reached"]
refusals = ["429", "quota exhausted", "usage limit reached",
            "500", "502", "503", "504", "Internal server error", "server error",
            "overloaded", "529", "at capacity", "model stream idle timeout"]
quotas = ["429", "quota exhausted", "usage limit reached", "usage limit", "rate limit",
          "insufficient_quota", "insufficient quota"]
# `terminal` is the event log's terminal record kind: the stream ends with `run_terminal`,
# which is what adapters/muse.sh reads final.md out of, failure or not.
terminal = "run_terminal"

[auth]
title = "Muse"
remedy = "exit Muse, run muse login in the host shell, then reopen the session"
signatures = [
  "not logged in: run /login to add an API key",
  "still unauthorized after a token refresh; run `muse login` again",
  "starting logged out (run `muse login`)",
  "your login is no longer saved; run `muse login` again.",
  "no login to refresh a key from; run `muse login` or set META_API_KEY",
  "Log in with browser · Enter to choose Set an API key ↓↑ to select · Esc to quit",
]

# The effort words this harness takes, in the order the menu's `c` screen cycles them.
# The same words its status line shows beside the model name; see [screen] composer above.
[effort]
levels = ["minimal", "low", "medium", "high", "xhigh", "max"]

# The models this harness runs when `muse serve`'s `model/list` cannot say (`adapters/muse.sh
# models` asks it): the Meta provider's catalog muse 1.3.0 keeps under
# ~/.local/share/muse/model-catalog, each model with its reasoning-effort variants, strongest
# last, and the Wonder models Muse lists today without their efforts.  Its labels are the ids
# themselves.
[catalog]
"muse-spark-1.3-contributor" = { efforts = ["minimal", "low", "medium", "high", "xhigh", "max"] }
"muse-spark-1.3" = { efforts = ["minimal", "low", "medium", "high", "xhigh", "max"] }
"muse-spark-1.2-contributor" = { efforts = ["minimal", "low", "medium", "high", "xhigh"] }
"muse-spark-1.2" = { efforts = ["minimal", "low", "medium", "high", "xhigh"] }
"muse-wonder-full-1.0" = { efforts = ["minimal", "low", "medium", "high", "xhigh", "max"] }
"muse-wonder-1.0" = { efforts = ["minimal", "low", "medium", "high", "xhigh", "max"] }
