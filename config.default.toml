# agentkit's shipped default config.  install.sh copies this to ~/.agentkit/config.toml once,
# when that file does not exist, and never overwrites it afterwards: the config is yours from
# then on.  Edit the copy in the home directory, not this file.

max_runs = 0              # no count cap; host memory and load are the gates
max_gates = 3             # done-when gates of one repository at once, host-wide; 0 = no cap
# min_free_mb and max_load default from this host's RAM and processor count.
# Set either to 0 to disable that one resource check.
# run_memory_max_mb, when set, is one run's memory cap in MiB. Unset, the cap is
# the smaller of 4 GB and 40% of the slice's MemoryMax, and swap is capped the same.
pace_margin = 10          # the one knob: a subscription more than this far ahead of pace no
                          # longer keeps a payg provider out; workers rank on budget, not on
                          # pace, and the orchestrator choice reads neither

# Every [models.*] entry whose provider has a [providers.*] table can orchestrate and can work.
# [defaults] is what a new seat takes with Enter, and what anything outside a seat works with.
# Orchestrator = the default while none of its meters reads 100% used, else the first model in
# this file's order that can still be spent, else the default anyway with a WARN.
# Executor = the worker with the highest budget (Fable's lag preference still applies).
# Budget = minimum (fraction left + usage-limit resets in hand) / fraction of the window left
# across non-session limits; each reset in hand counts as one whole weekly allowance.
# Reviewer = highest budget on a different provider, else a permitted different model on the
# same provider. A meter at 100% used removes a worker even without a reset time, and so does a
# harness that is not installed or not logged in; unknown budgets rank last. The menu's `c`
# screen changes both defaults.
[defaults]
orchestrator = "opus"
workers = ["opus", "astra"]

[models.fable]
harness = "claude"
model = "claude-fable-5-1"
effort = "xhigh"
provider = "anthropic"
reviews_own_provider = false  # this model only reviews another company's work
meter = "weekly_scoped"   # optional: gate this model on a specific meter of its provider

[models.opus]
harness = "claude"
model = "claude-opus-5-5"
effort = "xhigh"
provider = "anthropic"

[models.astra]
harness = "codex"
model = "default"         # a ChatGPT-subscription Codex only runs its own default model: any
                          # -m comes back HTTP 400, so `default` means "let Codex choose" and
                          # the adapter passes no -m.  A real id belongs here under an API key.
effort = "xhigh"
provider = "openai"

[models.spark]
harness = "muse"
model = "muse-spark-1.3-contributor"
effort = "xhigh"
provider = "meta"

[models.grok]
harness = "grokbuild"
model = "grok-4.7"
effort = "xhigh"
provider = "xai"

[models.gemini]
harness = "antigravity"
model = "gemini-3.8-flash"
effort = "high"
provider = "google"

[models.mimo]
harness = "opencode"
model = "mimo/mimo-v2.6-pro"
effort = "none"
provider = "mimo"

# colour = "#RRGGBB" on a provider fills its bar in the menu's usage rows, which run red through
# violet by it.  anthropic, openai, meta, xai, google and mimo ship their companies' own; any
# other provider without one is drawn in the accent.
[providers.anthropic]
mode = "subscription"
[providers.openai]
mode = "subscription"
[providers.meta]
mode = "subscription"     # "payg" = used only as overflow when every subscription provider is ahead of pace
usage_model = "spark"      # one cached usage request, resolved through [models.*]
usage_effort = "minimal"
[providers.xai]
mode = "subscription"
[providers.google]
mode = "subscription"

# No mode: MiMo's is read off the global OpenCode opencode.json, over any mode written here --
# a plain token-plan URL is a subscription, anything else payg.
[providers.mimo]
