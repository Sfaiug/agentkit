# agentkit's shipped default config.  install.sh copies this to ~/.agentkit/config.toml once,
# when that file does not exist, and never overwrites it afterwards: the config is yours from
# then on.  Edit the copy in the home directory, not this file.

max_runs = 0              # no count cap; host memory is the gate
# max_gates, when set, pins the host-wide heavy-suite turns; unset, the count is
# derived from the slice's live CPU and memory headroom. 0 = no cap.
# min_free_mb defaults from this host's RAM. A pinned max_load restores the host load check instead.
# Set either to 0 to disable that one resource check.
# run_memory_max_mb, when set, is one run's memory cap in MiB. Unset, the cap is
# 40% of the slice's MemoryMax (4 GB where there is no ceiling), and swap is capped the same.
pace_margin = 10          # a subscription more than this far ahead of pace no longer keeps a
                          # payg provider out; workers come in an order drawn per run, and
                          # the orchestrator choice reads no pace
# remote_control = false starts a seat's harness without its Remote Control, where it has one
# (Claude Code's, its session still named after the seat, and Codex's). Absent, it is on.
# A seat already running keeps what it started with until its next launch.
# live_host = "<alias>" is the ssh alias of your live/deploy host a seat may not scp/rsync/sftp a file
# onto (it reaches the live host through the repo). ak ships with none set, so no transfer is guarded
# until you name your own host here; your deploy host is yours, and ak does not guess it.
# [machines.<alias>] names by ssh alias a machine ak may use beside this one and the suite_helper.
# Its work = ["turns", "tests"] marks builds and reviews, and tests; c edits those marks.

# Every [models.*] entry whose provider has a [providers.*] table can orchestrate and can work.
# [defaults] is what a new seat takes with Enter, and what anything outside a seat works with.
# Orchestrator = the default while none of its meters reads 100% used, else the first model in
# this file's order that can still be spent, else the default anyway with a WARN.
# Executor = the first worker that can run now in an order drawn at random per run among those
# marked, one on credits after every one with a window left.
# Reviewer = the first drawn the same way for reviewing, of another lab (its maker) while
# one marked has usage, else of the executor's, else the executor's own model, marked
# self-reviewed. A meter at 100% used removes a worker even without a reset time, and so does
# a harness that is not installed or not logged in. The menu's `c` screen changes both defaults.
# [audit] is the weekly audit's setting: on = true switches it on, and orchestrator, workers
# and reviewers name the models its seat takes, [defaults]'s for whatever the table leaves out.
# Absent, it is off.
# [done_check] is the done check's setting, edited on the `c` screen's `Done check` row: model
# = "<name>" is the model `ak orch check SEAT` asks whether a seat's work holds everything its
# owner asked of it; absent, one of the seat's reviewers that can run now. A seat whose plan has
# every line done owes that check, which `ak plan` makes, before it reads done; on = false
# switches that off.
[defaults]
orchestrator = "opus"
workers = ["opus", "astra"]

# effort is what a session runs a model at.  exec_effort and review_effort, optional and each an
# effort that model takes, are what an executor's or a fixer's turn and a reviewer's run it at;
# a model without one runs that role at effort.
[models.fable]
harness = "claude"
model = "claude-fable-5-1"
effort = "xhigh"
provider = "anthropic"
meter = "weekly_scoped"   # optional: gate this model on a specific meter of its provider

[models.opus]
harness = "claude"
model = "claude-opus-5-5"
effort = "xhigh"
provider = "anthropic"

[models.astra]
harness = "codex"
model = "gpt-6-astra"     # passed as -m. `default` would pass none and so run whatever the
                          # login's own Codex app last picked; any id `codex debug models` lists fits.
effort = "xhigh"
provider = "openai"

[models.spark]
harness = "muse"
model = "muse-spark-1.3-contributor"
effort = "xhigh"
provider = "meta"

[models.grok]
harness = "grokbuild"
model = "grok-4.7"
effort = "xhigh"
provider = "xai"

[models.gemini]
harness = "antigravity"
model = "gemini-3.8-flash"
effort = "high"
provider = "google"

[models.mimo]
harness = "opencode"
model = "mimo/mimo-v2.6-pro"
effort = "high"           # thinking on, as MiMo's own default is; `none` turns it off
provider = "mimo"

# name = "Z.AI Coding Plan" on a provider is what every screen calls it, else its company's name
# or its key capitalised; `+ add` writes the one OpenCode gives a provider it adds through it.
# price = 200 on a provider is what each of its subscriptions costs a month, in whatever you
# pay in, and price = { second = 100 } what the logins it names do; any other login costs its
# plan's list price in US dollars (`[plans]` in adapters/<harness>.toml).
[providers.anthropic]
mode = "subscription"
[providers.openai]
mode = "subscription"
[providers.meta]
mode = "subscription"     # "payg" = used only as overflow when every subscription provider is ahead of pace
usage_model = "spark"      # one cached usage request, resolved through [models.*]
usage_effort = "minimal"
[providers.xai]
mode = "subscription"
[providers.google]
mode = "subscription"

# No mode: MiMo's is read off the global OpenCode opencode.json, over any mode written here --
# a plain token-plan URL is a subscription, anything else payg.  `maker` is the boards' name for
# who makes a provider's models, where that is not the provider's own (config.company).
[providers.mimo]
maker = "Xiaomi"
